<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties for Sale & Rent | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>

  <section class="page-banner" style="padding:30px 0 40px">
    <div class="container">
      <div class="bc"><a href="index.html">Home</a> &nbsp;›&nbsp; <span id="bcTitle">Properties</span></div>
      <h1 style="margin-top:8px;font-size:30px" id="pageTitle">Properties for Sale</h1>
    </div>
  </section>

  <div class="container listings-layout">
    <aside class="filter-sidebar">
      <h3>Filters <span onclick="clearFilters()">Clear All</span></h3>
      <div class="f-group"><label>District</label><select id="f-district"><option value="">All Districts</option></select></div>
      <div class="f-group"><label>Property Type</label><select id="f-type"><option value="">All Types</option><option>Houses</option><option>Plots</option><option>Flats / Apartments</option><option>Commercial</option><option>Agricultural Land</option><option>Shops / Offices</option><option>Farm Houses</option></select></div>
      <div class="f-group"><label>Purpose</label><select id="f-purpose"><option value="">Buy & Rent</option><option>For Sale</option><option>For Rent</option></select></div>
      <div class="f-group"><label>Price Range (PKR)</label><div style="display:flex;gap:8px"><input type="number" id="f-min" placeholder="Min" style="width:50%"><input type="number" id="f-max" placeholder="Max" style="width:50%"></div></div>
      <div class="f-group"><label>Bedrooms</label><div class="filter-tabs" id="f-bed">
        <button class="filter-tab active" data-val="">Any</button>
        <button class="filter-tab" data-val="1">1</button>
        <button class="filter-tab" data-val="2">2</button>
        <button class="filter-tab" data-val="3">3</button>
        <button class="filter-tab" data-val="4">4</button>
        <button class="filter-tab" data-val="5">5+</button>
      </div></div>
      <div class="f-group"><label>Amenities</label>
        <label class="f-check"><input type="checkbox" class="f-amen" value="Parking"> Parking</label>
        <label class="f-check"><input type="checkbox" class="f-amen" value="Garden"> Garden</label>
        <label class="f-check"><input type="checkbox" class="f-amen" value="Security"> Security</label>
        <label class="f-check"><input type="checkbox" class="f-amen" value="Water Tank"> Water Tank</label>
        <label class="f-check"><input type="checkbox" class="f-amen" value="Boundary Wall"> Boundary Wall</label>
      </div>
      <button class="f-btn" onclick="applyFilters()"><i class="fas fa-search"></i> Apply Filters</button>
    </aside>

    <div>
      <div class="results-bar">
        <div class="rc" id="rc">Showing <strong>16 properties</strong> in Balochistan</div>
        <select id="sortSel" onchange="applyFilters()">
          <option value="new">Sort: Newest First</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="area-desc">Area: Large to Small</option>
        </select>
      </div>
      <div class="prop-grid" id="grid" style="grid-template-columns:repeat(3,1fr)"></div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    initShell('listings');

    // Populate districts
    DISTRICTS.forEach(d=>{const o=document.createElement('option');o.value=d.name;o.textContent=d.name;document.getElementById('f-district').appendChild(o)});

    // Read URL params
    const params=new URLSearchParams(location.search);
    if(params.get('type'))document.getElementById('f-type').value=params.get('type');
    if(params.get('district'))document.getElementById('f-district').value=params.get('district');
    if(params.get('purpose')==='rent'){document.getElementById('f-purpose').value='For Rent';document.getElementById('pageTitle').textContent='Properties for Rent';document.getElementById('bcTitle').textContent='Properties for Rent';}

    // Bedroom tabs
    document.querySelectorAll('#f-bed .filter-tab').forEach(btn=>{
      btn.addEventListener('click',function(){
        this.parentElement.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
      });
    });

    function applyFilters(){
      let list=[...PROPERTIES];
      const district=document.getElementById('f-district').value;
      const type=document.getElementById('f-type').value;
      const purpose=document.getElementById('f-purpose').value;
      const minP=parseInt(document.getElementById('f-min').value)||0;
      const maxP=parseInt(document.getElementById('f-max').value)||Infinity;
      const bedBtn=document.querySelector('#f-bed .filter-tab.active');
      const beds=bedBtn?bedBtn.dataset.val:'';
      const amens=[...document.querySelectorAll('.f-amen:checked')].map(c=>c.value);

      if(district)list=list.filter(p=>p.district===district);
      if(type)list=list.filter(p=>p.type===type);
      if(purpose)list=list.filter(p=>p.purpose===purpose);
      if(minP)list=list.filter(p=>p.price>=minP);
      if(maxP<Infinity)list=list.filter(p=>p.price<=maxP);
      if(beds){const b=parseInt(beds);list=list.filter(p=>b===5?p.beds>=5:p.beds===b);}
      if(amens.length)list=list.filter(p=>amens.some(a=>p.features.some(f=>f.toLowerCase().includes(a.toLowerCase()))));

      const sort=document.getElementById('sortSel').value;
      if(sort==='price-asc')list.sort((a,b)=>a.price-b.price);
      else if(sort==='price-desc')list.sort((a,b)=>b.price-a.price);
      else if(sort==='area-desc')list.sort((a,b)=>parseFloat(b.area.replace(/,/g,''))-parseFloat(a.area.replace(/,/g,'')));

      document.getElementById('rc').innerHTML=`Showing <strong>${list.length} properties</strong> ${district?'in '+district:'in Balochistan'}`;
      document.getElementById('grid').innerHTML=list.length?list.map(propCard).join(''):`
        <div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)">
          <i class="fas fa-search" style="font-size:48px;margin-bottom:16px;display:block"></i>
          <h3>No properties found</h3><p>Try adjusting your filters</p>
        </div>`;
    }

    function clearFilters(){
      document.getElementById('f-district').value='';
      document.getElementById('f-type').value='';
      document.getElementById('f-purpose').value='';
      document.getElementById('f-min').value='';
      document.getElementById('f-max').value='';
      document.querySelectorAll('.f-amen').forEach(c=>c.checked=false);
      document.querySelectorAll('#f-bed .filter-tab').forEach(b=>b.classList.remove('active'));
      document.querySelector('#f-bed .filter-tab').classList.add('active');
      applyFilters();
    }

    applyFilters();
  </script>
</body>
</html>
