<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties for Sale & Rent | Quetta Digital Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-banner">
    <div class="container">
      <h1 id="listings-title">Properties for Sale</h1>
      <div class="breadcrumb"><a href="index.html">Home</a> / <span id="breadcrumb-text">Properties for Sale</span></div>
    </div>
  </div>

  <div class="container listings-layout">
    <div class="filter-panel">
      <div class="filter-title">Filters <span class="filter-clear" onclick="clearFilters()">Clear All</span></div>

      <div class="filter-group"><label>District</label>
        <select id="f-district"><option value="">All Districts</option></select>
      </div>
      <div class="filter-group"><label>Property Type</label>
        <select id="f-type"><option value="">All Types</option><option value="house">House</option><option value="plot">Plot</option><option value="apartment">Apartment</option><option value="commercial">Commercial</option></select>
      </div>
      <div class="filter-group"><label>Purpose</label>
        <select id="f-purpose"><option value="">Buy & Rent</option><option value="sale">For Sale</option><option value="rent">For Rent</option></select>
      </div>
      <div class="filter-group"><label>Price Range (PKR)</label>
        <div style="display:flex;gap:8px"><input type="number" id="f-min-price" placeholder="Min" style="width:50%"><input type="number" id="f-max-price" placeholder="Max" style="width:50%"></div>
      </div>
      <div class="filter-group"><label>Bedrooms</label>
        <div class="bed-btns" id="f-bedrooms">
          <button class="bed-btn active" data-val="">Any</button>
          <button class="bed-btn" data-val="1">1</button>
          <button class="bed-btn" data-val="2">2</button>
          <button class="bed-btn" data-val="3">3</button>
          <button class="bed-btn" data-val="4">4</button>
          <button class="bed-btn" data-val="5">5+</button>
        </div>
      </div>
      <div class="filter-group"><label>Area (sqft)</label>
        <div style="display:flex;gap:8px"><input type="number" id="f-min-area" placeholder="Min" style="width:50%"><input type="number" id="f-max-area" placeholder="Max" style="width:50%"></div>
      </div>
      <div class="filter-group"><label>Amenities</label><div class="filter-checks">
        <label><input type="checkbox" class="f-amenity" value="Parking"> Parking</label>
        <label><input type="checkbox" class="f-amenity" value="Garden"> Garden</label>
        <label><input type="checkbox" class="f-amenity" value="Security"> Security</label>
        <label><input type="checkbox" class="f-amenity" value="Water Tank"> Water Tank</label>
        <label><input type="checkbox" class="f-amenity" value="Boundary Wall"> Boundary Wall</label>
        <label><input type="checkbox" class="f-amenity" value="Swimming Pool"> Swimming Pool</label>
        <label><input type="checkbox" class="f-amenity" value="CCTV"> CCTV</label>
      </div></div>
      <button class="filter-apply" onclick="applyFilters()"><i class="fas fa-search"></i> Apply Filters</button>
    </div>

    <div>
      <div class="results-bar">
        <div class="results-count" id="results-count">Showing <strong>20 properties</strong> in Balochistan</div>
        <select id="sort-select" onchange="applyFilters()" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit">
          <option value="newest">Sort: Newest First</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="area-desc">Area: Large to Small</option>
        </select>
      </div>
      <div class="prop-grid" id="listings-grid"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    function populateDistrictFilter(){
      const sel=document.getElementById("f-district");
      DISTRICTS.forEach(d=>{const o=document.createElement("option");o.value=d.name;o.textContent=d.name;sel.appendChild(o)});
    }

    function applyFilters(){
      let filtered=[...PROPERTIES];
      const district=document.getElementById("f-district").value;
      const type=document.getElementById("f-type").value;
      const purpose=document.getElementById("f-purpose").value;
      const minPrice=parseInt(document.getElementById("f-min-price").value)||0;
      const maxPrice=parseInt(document.getElementById("f-max-price").value)||Infinity;
      const minArea=parseInt(document.getElementById("f-min-area").value)||0;
      const maxArea=parseInt(document.getElementById("f-max-area").value)||Infinity;
      const activeBedBtn=document.querySelector("#f-bedrooms .bed-btn.active");
      const bedrooms=activeBedBtn?activeBedBtn.dataset.val:"";
      const amenities=[...document.querySelectorAll(".f-amenity:checked")].map(c=>c.value);

      if(district)filtered=filtered.filter(p=>p.district===district);
      if(type)filtered=filtered.filter(p=>p.type===type);
      if(purpose)filtered=filtered.filter(p=>p.purpose===purpose);
      if(minPrice)filtered=filtered.filter(p=>p.price>=minPrice);
      if(maxPrice<Infinity)filtered=filtered.filter(p=>p.price<=maxPrice);
      if(minArea)filtered=filtered.filter(p=>p.area>=minArea);
      if(maxArea<Infinity)filtered=filtered.filter(p=>p.area<=maxArea);
      if(bedrooms){
        const bed=parseInt(bedrooms);
        filtered=filtered.filter(p=>bed===5?p.bedrooms>=5:p.bedrooms===bed);
      }
      if(amenities.length)filtered=filtered.filter(p=>amenities.some(a=>p.features.some(f=>f.toLowerCase().includes(a.toLowerCase()))));

      const sort=document.getElementById("sort-select").value;
      if(sort==="price-asc")filtered.sort((a,b)=>a.price-b.price);
      else if(sort==="price-desc")filtered.sort((a,b)=>b.price-a.price);
      else if(sort==="area-desc")filtered.sort((a,b)=>b.area-a.area);

      document.getElementById("results-count").innerHTML=`Showing <strong>${filtered.length} properties</strong> ${district?'in '+district:'in Balochistan'}`;
      document.getElementById("listings-grid").innerHTML=filtered.length?filtered.map(propertyCard).join(""):`<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--muted)"><i class="fas fa-search" style="font-size:48px;margin-bottom:16px;display:block"></i><h3>No properties found</h3><p>Try adjusting your filters</p></div>`;
    }

    function clearFilters(){
      document.getElementById("f-district").value="";
      document.getElementById("f-type").value="";
      document.getElementById("f-purpose").value="";
      document.getElementById("f-min-price").value="";
      document.getElementById("f-max-price").value="";
      document.getElementById("f-min-area").value="";
      document.getElementById("f-max-area").value="";
      document.querySelectorAll(".f-amenity").forEach(c=>c.checked=false);
      document.querySelectorAll("#f-bedrooms .bed-btn").forEach(b=>b.classList.remove("active"));
      document.querySelector('#f-bedrooms .bed-btn[data-val=""]').classList.add("active");
      applyFilters();
    }

    function readURLParams(){
      const params=new URLSearchParams(location.search);
      if(params.get("district"))document.getElementById("f-district").value=params.get("district");
      if(params.get("type"))document.getElementById("f-type").value=params.get("type");
      if(params.get("purpose"))document.getElementById("f-purpose").value=params.get("purpose");
      if(params.get("q")){
        document.querySelector(".search-field input").value=params.get("q");
      }
      const purpose=params.get("purpose");
      if(purpose==="rent"){
        document.getElementById("listings-title").textContent="Properties for Rent";
        document.getElementById("breadcrumb-text").textContent="Properties for Rent";
      }
    }

    document.querySelectorAll("#f-bedrooms .bed-btn").forEach(btn=>{
      btn.addEventListener("click",function(){
        this.parentElement.querySelectorAll(".bed-btn").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
      });
    });

    populateDistrictFilter();
    readURLParams();
    applyFilters();
    initHeader();
  </script>
</body>
</html>
