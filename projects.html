<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Projects | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <section class="page-banner" style="padding:30px 0 40px"><div class="container"><div class="bc"><a href="index.html">Home</a> › <span>New Projects</span></div><h1 style="margin-top:8px;font-size:30px">New Projects in Balochistan</h1></div></section>
  <section class="section">
    <div class="container">
      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    initShell('projects');
    document.getElementById('projectGrid').innerHTML=PROJECTS.map(p=>`
      <div class="project-card">
        <div class="project-img">
          <img src="${p.img}" alt="${p.name}" loading="lazy">
          <span class="prop-badge badge-featured">${p.status}</span>
        </div>
        <div class="project-body">
          <h3>${p.name}</h3>
          <div class="prop-loc"><i class="fas fa-map-marker-alt"></i> ${p.location}</div>
          <div class="project-specs">
            <span><i class="fas fa-home"></i> ${p.plotSizes}</span>
            <span><i class="fas fa-calendar"></i> ${p.timeline}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px;gap:12px">
            <div style="flex-shrink:0"><span style="font-size:11px;color:var(--muted)">Starting From</span><div style="font-weight:700;color:var(--green);font-size:16px;white-space:nowrap">${p.priceFrom}</div></div>
            <a href="contact.html" style="flex-shrink:0;padding:8px 16px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;font-weight:600;color:var(--text);text-decoration:none;white-space:nowrap;transition:.2s">Get Details →</a>
          </div>
        </div>
      </div>`).join('');
  </script>
</body>
</html>
