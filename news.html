<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real Estate News | Quetta Digital Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header-placeholder"></div>

  <div class="page-banner">
    <div class="container">
      <h1>Real Estate News</h1>
      <div class="breadcrumb"><a href="index.html">Home</a> / News</div>
    </div>
  </div>

  <div class="container" style="padding:32px 0 60px">
    <div id="news-container"></div>
  </div>

  <div id="footer-placeholder"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    const params=new URLSearchParams(location.search);
    const newsId=parseInt(params.get("id"));

    if(newsId){
      const n=NEWS.find(x=>x.id===newsId);
      document.title=n.title+" | QDP.pk News";
      const otherNews=NEWS.filter(x=>x.id!==newsId);
      document.getElementById("news-container").innerHTML=`
        <div style="display:grid;grid-template-columns:1fr 320px;gap:32px;align-items:start">
          <article>
            <div style="border-radius:var(--radius);overflow:hidden;margin-bottom:24px"><img src="${n.img}" alt="${n.title}" style="width:100%;height:400px;object-fit:cover"></div>
            <div class="news-date" style="margin-bottom:8px;font-size:14px"><i class="far fa-calendar"></i> ${n.date}</div>
            <h1 style="font-size:28px;font-weight:800;line-height:1.3;margin-bottom:16px">${n.title}</h1>
            <p style="font-size:15px;line-height:1.9;color:#555">${n.content}</p>
            <div style="margin-top:32px;padding-top:24px;border-top:1px solid var(--border);display:flex;gap:12px">
              <a href="#" class="btn btn-outline" style="font-size:13px"><i class="fab fa-facebook"></i> Share</a>
              <a href="#" class="btn btn-outline" style="font-size:13px"><i class="fab fa-twitter"></i> Tweet</a>
              <a href="#" class="btn btn-outline" style="font-size:13px"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            </div>
          </article>
          <aside>
            <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:sticky;top:90px">
              <h3 style="font-weight:700;margin-bottom:16px">More News</h3>
              ${otherNews.map(o=>`
              <a href="news.html?id=${o.id}" style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit">
                <img src="${o.img}" style="width:80px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0">
                <div><div style="font-size:12px;color:var(--muted)">${o.date}</div><div style="font-size:13px;font-weight:600;line-height:1.4;margin-top:4px">${o.title}</div></div>
              </a>`).join("")}
            </div>
          </aside>
        </div>`;
    }else{
      document.getElementById("news-container").innerHTML=`
        <div style="text-align:center;margin-bottom:40px"><h2 style="font-weight:800">Latest News & Updates</h2><p style="color:var(--muted);margin-top:8px">Stay informed about Balochistan's real estate market</p></div>
        <div class="news-grid">${NEWS.map(n=>`
          <a href="news.html?id=${n.id}" class="news-card">
            <div class="news-img"><img src="${n.img}" alt="${n.title}" loading="lazy"></div>
            <div class="news-body">
              <div class="news-date"><i class="far fa-calendar"></i> ${n.date}</div>
              <div class="news-title">${n.title}</div>
              <p class="news-excerpt">${n.excerpt}</p>
            </div>
          </a>`).join("")}</div>`;
    }
    initHeader();
  </script>
</body>
</html>
