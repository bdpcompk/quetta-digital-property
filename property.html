<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Detail | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <section class="page-banner" style="padding:25px 0 35px"><div class="container"><div class="bc"><a href="index.html">Home</a> › <a href="listings.html">Properties</a> › <span id="bcTitle">Detail</span></div><h1 style="margin-top:6px;font-size:26px">Property Details</h1></div></section>
  <div class="container detail-grid" id="detail" style="padding-bottom:40px"></div>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    initShell('listings');
    const id=parseInt(new URLSearchParams(location.search).get('id'))||1;
    const p=PROPERTIES.find(x=>x.id===id)||PROPERTIES[0];
    const agent=getAgent(p.agentId);
    const similar=PROPERTIES.filter(x=>x.id!==p.id&&x.district===p.district).slice(0,3);
    let gi=0;
    document.getElementById('bcTitle').textContent=p.title;
    document.title=p.title+" | Balochistan Property Portal";

    function renderGal(){
      document.getElementById('gImg').src=p.images[gi];
      document.getElementById('gCount').textContent=`📷 ${gi+1}/${p.images.length}`;
      document.querySelectorAll('.gal-thumbs img').forEach((img,i)=>img.classList.toggle('active',i===gi));
    }
    function gMove(d){gi=(gi+d+p.images.length)%p.images.length;renderGal()}

    document.getElementById('detail').innerHTML=`
      <div class="detail-main">
        <section>
          <div class="gallery"><img id="gImg" src="${p.images[0]}" alt="${p.title}"><div class="gal-nav prev" onclick="gMove(-1)"><i class="fas fa-chevron-left"></i></div><div class="gal-nav next" onclick="gMove(1)"><i class="fas fa-chevron-right"></i></div><span class="gal-count" id="gCount">📷 1/${p.images.length}</span></div>
          <div class="gal-thumbs">${p.images.map((im,i)=>`<img src="${im}" class="${i===0?'active':''}" onclick="gi=${i};renderGal()">`).join('')}</div>
        </section>
        <section>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
            <div><h1 class="detail-title">${p.title}</h1><div class="detail-loc"><i class="fas fa-map-marker-alt"></i> ${p.address}</div></div>
            <div class="detail-price">${p.priceText}${p.purpose==='For Rent'?' /month':''}</div>
          </div>
          <div class="key-feat">
            ${p.beds?`<div class="kf"><i class="fas fa-bed"></i><div class="v">${p.beds}</div><div class="l">Bedrooms</div></div>`:''}
            ${p.baths?`<div class="kf"><i class="fas fa-bath"></i><div class="v">${p.baths}</div><div class="l">Bathrooms</div></div>`:''}
            <div class="kf"><i class="fas fa-ruler-combined"></i><div class="v">${p.area}</div><div class="l">Area</div></div>
            <div class="kf"><i class="fas fa-map-pin"></i><div class="v">${p.district}</div><div class="l">District</div></div>
            <div class="kf"><i class="fas fa-tag"></i><div class="v">${p.purpose}</div><div class="l">Status</div></div>
          </div>
        </section>
        <section><h3 style="font-weight:700;margin-bottom:12px">Description</h3><p class="detail-desc">${p.desc}</p></section>
        <section><h3 style="font-weight:700;margin-bottom:12px">Features & Amenities</h3><div class="detail-features">${p.features.map(f=>`<div class="df"><i class="fas fa-check-circle"></i> ${f}</div>`).join('')}</div></section>
        <section><h3 style="font-weight:700;margin-bottom:12px">Property Details</h3>
          <div class="detail-table">
            <div class="dr"><span class="dl">Property Type</span><span class="dv">${p.type}</span></div>
            <div class="dr"><span class="dl">Purpose</span><span class="dv">${p.purpose}</span></div>
            <div class="dr"><span class="dl">Area</span><span class="dv">${p.area}</span></div>
            <div class="dr"><span class="dl">District</span><span class="dv">${p.district}</span></div>
            <div class="dr"><span class="dl">Listed</span><span class="dv">2 Weeks Ago</span></div>
            <div class="dr"><span class="dl">Verified</span><span class="dv">${p.verified?'Yes':'No'}</span></div>
          </div>
        </section>
      </div>
      <div class="detail-side">
        <div class="agent-box">
          <div class="agent-box-top">
            <div class="agent-avatar" style="width:48px;height:48px;font-size:16px">${agent.avatar}</div>
            <div><h3>${agent.name}</h3><p>${agent.type}</p></div>
          </div>
          <div class="ab-contact"><i class="fas fa-phone"></i> ${agent.phone}</div>
          <div class="ab-contact"><i class="fas fa-envelope"></i> ${agent.email}</div>
          <div class="ab-actions">
            <a class="wa-btn" href="https://wa.me/${agent.phone.replace(/[^0-9]/g,'')}" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <button class="call-btn" onclick="location.href='tel:${agent.phone}'"><i class="fas fa-phone"></i> Call Now</button>
            <button class="msg-btn"><i class="fas fa-envelope"></i> Send Message</button>
          </div>
        </div>
        ${similar.length?`<div class="similar-box"><h3>Similar Properties in ${p.district}</h3>${similar.map(s=>`<a class="sim-item" href="property.html?id=${s.id}"><img src="${s.img}"><div><h4>${s.title}</h4><p>${s.priceText}</p></div></a>`).join('')}</div>`:''}
      </div>`;
  </script>
</body>
</html>
