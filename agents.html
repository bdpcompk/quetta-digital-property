<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Agents | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <section class="page-banner" style="padding:30px 0 40px"><div class="container"><div class="bc"><a href="index.html">Home</a> › <span>Agents</span></div><h1 style="margin-top:8px;font-size:30px">Verified Agents in Balochistan</h1></div></section>
  <section class="section">
    <div class="container">
      <div class="results-bar" style="margin-bottom:20px">
        <div class="rc" id="rc"></div>
        <select id="sortSel" onchange="renderAgents()"><option value="rating">Sort: Top Rated</option><option value="reviews">Most Reviews</option></select>
      </div>
      <div class="agent-grid" id="agentGrid"></div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    initShell('agents');
    function renderAgents(){
      let list=[...AGENTS];
      if(document.getElementById('sortSel').value==='reviews')list.sort((a,b)=>b.reviews-a.reviews);
      else list.sort((a,b)=>b.rating-a.rating);
      document.getElementById('rc').innerHTML=`Showing <strong>${list.length} verified agents</strong>`;
      document.getElementById('agentGrid').innerHTML=list.map(a=>`
        <div class="agent-card">
          <div class="agent-top">
            <div class="agent-avatar">${a.avatar}</div>
            <div class="agent-info"><h3>${a.name}</h3><span class="a-type">${a.type}</span></div>
          </div>
          <div class="agent-meta">
            <span><i class="fas fa-star a-star"></i> ${a.rating} (${a.reviews})</span>
            <span><i class="fas fa-map-marker-alt"></i> ${a.location}</span>
            ${a.verified?'<span class="a-verified"><i class="fas fa-check-circle"></i> Verified</span>':''}
          </div>
          <div style="padding:0 20px 16px;font-size:12px;color:var(--muted)"><i class="fas fa-phone"></i> ${a.phone} &nbsp; <i class="fas fa-envelope"></i> ${a.email}</div>
          <a class="agent-btn" href="listings.html?district=${a.location}">View Listings →</a>
        </div>`).join('');
    }
    renderAgents();
  </script>
</body>
</html>
