<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <section class="page-banner" style="padding:30px 0 40px"><div class="container"><div class="bc"><a href="index.html">Home</a> › <span>Contact</span></div><h1 style="margin-top:8px;font-size:30px">Get in Touch</h1></div></section>
  <section class="section">
    <div class="container">
      <div class="contact-grid">
        <div>
          <div class="contact-info">
            <div class="ci"><div class="ci-i"><i class="fas fa-map-marker-alt"></i></div><div><h4>Office Address</h4><p>Zarghoon Road, Quetta, Balochistan, Pakistan</p></div></div>
            <div class="ci"><div class="ci-i"><i class="fas fa-phone"></i></div><div><h4>Phone</h4><p>+92 81 1234567 &nbsp; • &nbsp; +92 300 1234567</p></div></div>
            <div class="ci"><div class="ci-i"><i class="fas fa-envelope"></i></div><div><h4>Email</h4><p>info@balochistanproperty.pk</p></div></div>
            <div class="ci"><div class="ci-i"><i class="fas fa-clock"></i></div><div><h4>Working Hours</h4><p>Mon – Sat: 9:00 AM – 6:00 PM</p></div></div>
          </div>
        </div>
        <div class="contact-form">
          <h3>Send Us a Message</h3>
          <div class="cform-row">
            <div class="f-group"><label>Your Name</label><input type="text" placeholder="Full Name"></div>
            <div class="f-group"><label>Phone</label><input type="tel" placeholder="+92 300 0000000"></div>
          </div>
          <div class="f-group"><label>Email</label><input type="email" placeholder="you@example.com"></div>
          <div class="f-group"><label>Subject</label><select><option>General Inquiry</option><option>Property Listing</option><option>QDA Approved Schemes</option><option>Advertising</option><option>Report an Issue</option></select></div>
          <div class="f-group"><label>Message</label><textarea rows="5" placeholder="Write your message here..."></textarea></div>
          <button class="f-btn" onclick="alert('Thank you! Your message has been sent.')"><i class="fas fa-paper-plane"></i> Send Message</button>
        </div>
      </div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>initShell('contact');</script>
</body>
</html>
