<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Areas & Districts | Balochistan Property Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="header"></div>
  <section class="page-banner" style="padding:30px 0 40px"><div class="container"><div class="bc"><a href="index.html">Home</a> › <span>Areas & Districts</span></div><h1 style="margin-top:8px;font-size:30px">Explore Areas in Balochistan</h1></div></section>
  <section class="section-white">
    <div class="container">
      <div class="district-grid" id="districtRow"></div>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div class="section-head"><h2>Popular Areas in Quetta</h2></div>
      <div class="area-list" id="areaList"></div>
    </div>
  </section>
  <div id="footer"></div>
  <script src="data.js"></script>
  <script src="components.js"></script>
  <script>
    initShell('areas');
    document.getElementById('districtRow').innerHTML=DISTRICTS.map(d=>`
      <a class="district-card" href="listings.html?district=${d.name}">
        <img src="${d.cover}" alt="${d.name}" loading="lazy">
        <div class="d-overlay"><h3>${d.name}</h3><p>${d.count} Properties</p></div>
      </a>`).join('');

    const AREAS=[
      {name:'Jinnah Town',count:42,d:'Quetta'},
      {name:'Satellite Town',count:36,d:'Quetta'},
      {name:'Zarghoon Road',count:28,d:'Quetta'},
      {name:'Samungli',count:24,d:'Quetta'},
      {name:'Cantt',count:31,d:'Quetta'},
      {name:'New Alizai',count:18,d:'Quetta'},
      {name:'Khuzdar Road',count:15,d:'Quetta'},
      {name:'Airport Road',count:22,d:'Quetta'},
      {name:'Prince Road',count:20,d:'Quetta'},
      {name:'Sariab Road',count:17,d:'Quetta'},
      {name:'Gulshan Colony',count:14,d:'Quetta'},
      {name:'Haji Camp',count:12,d:'Quetta'}
    ];
    document.getElementById('areaList').innerHTML=AREAS.map(a=>`
      <a class="area-item" href="listings.html?district=${a.d}">
        <div class="area-icon"><i class="fas fa-map-marker-alt"></i></div>
        <div><h4>${a.name}</h4><p>${a.d} • ${a.count} Properties</p></div>
        <i class="fas fa-arrow-right" style="color:var(--muted);margin-left:auto"></i>
      </a>`).join('');
  </script>
</body>
</html>
